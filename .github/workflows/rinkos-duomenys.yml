name: Rinkos duomenys

on:
  push:                      # pasileidžia savaime, kai pakeiti šiuos failus
    branches: [main]
    paths:
      - ".github/workflows/rinkos-duomenys.yml"
      - "surinkti.py"
      - "akcijos.txt"
      - "etf.txt"
  schedule:
      - cron: "23 3 * * 1-6" # pirmadienį–šeštadienį 03:23 UTC: po kiekvienos JAV prekybos dienos ir pirmadienio rytą,
                             # kad R6 sąrašas būtų pirmą mėnesio prekybos dieną, net jei mėnuo prasideda sekmadienį ar pirmadienį
  workflow_dispatch:         # galima paleisti ranka: Actions → Rinkos duomenys → Run workflow
    inputs:
      perkurti_analitikus:
        description: "Perkurti visą analitikų istoriją dabar (pvz., kai Yahoo vėl atnaujina analitikų duomenis)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rinkos-duomenys
  cancel-in-progress: false

jobs:
  surinkti:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Įdiegti priklausomybes
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "yfinance>=1.8,<2" "pandas>=2"

      - name: Surinkti duomenis
        run: .venv/bin/python surinkti.py
        env:
          PERKURTI_ANALITIKUS: ${{ github.event.inputs.perkurti_analitikus }}

      - name: Įrašyti į repozitoriją
        run: |
          git config user.name "rinkos-duomenys"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Pakeitimų nėra"
            exit 0
          fi
          git commit -m "Duomenys $(date -u +%F)"
          # Jei surinkimo metu į repozitoriją kas nors įkėlė failų (pvz., README.md), pirmiausia
          # pasiimami tie pakeitimai; jei sutampa duomenų failai, palieka šio paleidimo duomenis.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Įrašyti nepavyko (bandymas $i iš 5), kartojama po 20 s"
            sleep 20
          done
          exit 1
